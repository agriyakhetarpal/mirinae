name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (macOS ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read # checkout only
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          xcode-select -p
          swift --version

      - name: Build
        run: swift build

      - name: Test
        run: Scripts/test.sh

      - name: Translations
        run: |
          python3 Scripts/extract-strings.py
          git diff --exit-code -- Localizations/en.lproj/Localizable.strings || {
            echo "Localizable.strings is out of date. Run Scripts/extract-strings.py and commit." >&2
            exit 1
          }
          python3 Scripts/check-strings.py

      - name: Package
        run: Scripts/package.sh --allow-untagged

      - name: Smoke test
        run: build/Mirinae.app/Contents/MacOS/Mirinae --version

      - name: Upload bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Mirinae-${{ matrix.os }}
          path: build/Mirinae-*.zip
          retention-days: 14
