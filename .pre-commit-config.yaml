repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-xml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 38bfb07c0c64c304f47eb52090f8288150c77730 # frozen: v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: a6564f5d57444e123433a5c9af733e3975c77229 # frozen: v0.11.0.1-1
    hooks:
      - id: shellcheck

  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # frozen: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: d25b2b1dc80689fb633f21f6978bba69871181d3 # frozen: v1.31.0
    hooks:
      - id: zizmor
        args: [--pedantic]

  - repo: local
    hooks:
      - id: swift-format
        name: swift-format
        entry: Scripts/swift-format.sh format --in-place
        language: script
        types: [swift]
      - id: swift-format-lint
        name: swift-format lint
        entry: Scripts/swift-format.sh lint --strict
        language: script
        types: [swift]
      - id: extract-strings
        name: regenerate Localizable.strings
        entry: python3 Scripts/extract-strings.py
        language: system
        files: ^(Sources/.*\.swift|Scripts/extract-strings\.py)$
        pass_filenames: false
      - id: check-strings
        name: check translations
        entry: python3 Scripts/check-strings.py
        language: system
        files: ^(Localizations/.*|Scripts/check-strings\.py)$
        pass_filenames: false
