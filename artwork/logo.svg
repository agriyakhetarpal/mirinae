<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="1024" height="1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#33459e"/>
      <stop offset="1" stop-color="#1799ad"/>
    </linearGradient>
    <linearGradient id="bladeL" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0" stop-color="#e6e6e6"/>
      <stop offset="1" stop-color="#b3b3b3"/>
    </linearGradient>
    <linearGradient id="bladeR" x1="1" y1="0" x2="0" y2="0.3">
      <stop offset="0" stop-color="#e6e6e6"/>
      <stop offset="1" stop-color="#b3b3b3"/>
    </linearGradient>
  </defs>
  <rect x="7" y="7" width="86" height="86" rx="20" fill="url(#tile)"/>
  <!-- left bud -->
  <g transform="rotate(8 35 40)">
    <ellipse cx="35" cy="40" rx="13.5" ry="11" fill="#ffffff" fill-opacity="0.96"/>
  </g>
  <g transform="rotate(5 35 40)">
    <rect x="29.8" y="38" width="10.4" height="46" rx="3.4" fill="url(#bladeL)" stroke="#8c8c8c" stroke-opacity="0.5" stroke-width="0.6"/>
    <circle cx="35" cy="41.5" r="3" fill="#33459e" fill-opacity="0.55"/>
  </g>
  <!-- right bud -->
  <g transform="rotate(-8 65 40)">
    <ellipse cx="65" cy="40" rx="13.5" ry="11" fill="#ffffff" fill-opacity="0.96"/>
  </g>
  <g transform="rotate(-5 65 40)">
    <rect x="59.8" y="38" width="10.4" height="46" rx="3.4" fill="url(#bladeR)" stroke="#8c8c8c" stroke-opacity="0.5" stroke-width="0.6"/>
    <circle cx="65" cy="41.5" r="3" fill="#33459e" fill-opacity="0.55"/>
  </g>
</svg>
